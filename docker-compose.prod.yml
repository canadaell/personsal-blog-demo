services:
  # Backend Service
  backend:
    image: ghcr.io/canadaell/personsal-blog-demo/backend:latest
    container_name: blog-backend
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-postgresql}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_INITIAL_ADMIN_USERNAME=${AUTH_INITIAL_ADMIN_USERNAME:-}
      - AUTH_INITIAL_ADMIN_EMAIL=${AUTH_INITIAL_ADMIN_EMAIL:-}
      - AUTH_INITIAL_ADMIN_PASSWORD=${AUTH_INITIAL_ADMIN_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - GIN_MODE=release
    ports:
      - "8080:8080"
    networks:
      - app_net

  # Frontend Service
  frontend:
    image: ghcr.io/canadaell/personsal-blog-demo/frontend:latest
    container_name: blog-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://blog-backend:8080 # Internal communication
    ports:
      - "3000:3000"
    networks:
      - app_net

  # Nginx Gateway
  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "8888:80" # Map to 8888 on host to avoid conflict with 1Panel Nginx (usually on 80)
      #- "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - app_net

networks:
  app_net:
    name: 1panel-network
    external: true
