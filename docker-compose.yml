services:
  # Backend Service
  backend:
    image: ghcr.io/canadaell/personsal-blog-demo/backend:latest
    container_name: blog-backend
    restart: always
    environment:
      - DB_HOST=${DB_HOST:-postgres} # Use env var or default to 'postgres'
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_PUBLIC_DOMAIN=${R2_PUBLIC_DOMAIN}
      - AUTH_JWT_SECRET=${AUTH_JWT_SECRET}
      - AUTH_INITIAL_ADMIN_USERNAME=${AUTH_INITIAL_ADMIN_USERNAME:-}
      - AUTH_INITIAL_ADMIN_EMAIL=${AUTH_INITIAL_ADMIN_EMAIL:-}
      - AUTH_INITIAL_ADMIN_PASSWORD=${AUTH_INITIAL_ADMIN_PASSWORD:-}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    # Mount config if you prefer file-based config, OR use ENV vars above
    # volumes:
    #   - ./config.yaml:/app/config.yaml 
    ports:
      - "8080:8080"
    networks:
      - blog-network

  # Frontend Service
  frontend:
    image: ghcr.io/canadaell/personsal-blog-demo/frontend:latest
    container_name: blog-frontend
    restart: always
    environment:
      # Internal URL for SSR (Server to Server)
      - NEXT_PUBLIC_API_URL=http://backend:8080
    ports:
      - "3000:3000"
    networks:
      - blog-network

  # Nginx Gateway
  nginx:
    image: nginx:alpine
    container_name: blog-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      # Mount certificates when you have them
      # - ./cert.pem:/etc/nginx/cert.pem
      # - ./key.pem:/etc/nginx/key.pem
    depends_on:
      - frontend
      - backend
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
