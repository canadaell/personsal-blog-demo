version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: blog-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: blog_db
    ports:
      - "5432:5432"
    volumes:
      # 这里模拟 Block Storage，将数据持久化保存到本地的 postgres_data 目录
      - ./postgres_data:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: blog-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - DB_HOST=db 
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=blog_db
      - DB_PORT=5432
    # 开发模式下，可以将本地目录挂载进去，实现热重载 (可选)
    # volumes:
    #   - ./backend:/app
